sonar.projectKey=gabrielpagnan_integration-test-jest
sonar.organization=gabrielpagnan
sonar.projectName=Jest Integration Tests
sonar.projectVersion=1.0
sonar.sources=./test
sonar.sourceEncoding=UTF-8

# O projeto contém apenas testes de integração de APIs externas: não há
# código de produção para medir cobertura.
sonar.coverage.exclusions=**/*

# A regra S2699 só reconhece o expect() do Jest; nos testes as asserções
# são feitas pelo PactumJS (expectStatus, expectJson, expectJsonMatch...).
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2699
sonar.issue.ignore.multicriteria.e1.resourceKey=test/**/*.spec.ts
